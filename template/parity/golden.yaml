# Golden set for the release parity check (.github/workflows/parity.yml).
#
# Every run compares tools/list between the last release and this change:
# each tool's name, title, full description, input schema, output schema and
# annotations. That needs nothing in this file.
#
# Golden calls add behavior: each one is sent to both servers and the answers
# are diffed. Only list READ-ONLY calls whose answer does not depend on a live
# upstream service; both containers run with the dummy env in parity.env, so a
# call that needs a real API key or a reachable upstream will fail on both
# sides and prove nothing. Each call must say read_only: true.

calls: []
# Example:
#
# calls:
#   - id: hello-named           # stable name; differences are reported as calls.<id>...
#     tool: hello
#     arguments:
#       name: parity
#     read_only: true

# Volatile fields, blanked to "<normalized>" in every call answer before the
# diff. JSON inside text answers is parsed first, so nested keys can be named.
normalize:
  keys: []                     # e.g. [generated_at, request_id]
  patterns: []                 # regexes, e.g. ['\d{4}-\d{2}-\d{2}T[0-9:.]+(Z|[+-]\d{2}:\d{2})?']
