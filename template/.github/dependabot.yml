---
version: 2
updates:
- package-ecosystem: pip
  directory: "/"
  schedule:
    interval: weekly
    day: tuesday
    time: '09:30'
    timezone: America/New_York
  open-pull-requests-limit: 2
  labels:
  - dependencies
  - python
  commit-message:
    prefix: deps
    include: scope
  groups:
    python-minor-patch:
      update-types:
      - minor
      - patch
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
    day: tuesday
    time: '09:30'
    timezone: America/New_York
  open-pull-requests-limit: 1
  labels:
  - dependencies
  - github-actions
  commit-message:
    prefix: ci
    include: scope
  groups:
    actions-minor-patch:
      update-types:
      - minor
      - patch
- package-ecosystem: docker
  directory: "/"
  schedule:
    interval: weekly
    day: tuesday
    time: '09:30'
    timezone: America/New_York
  open-pull-requests-limit: 1
  labels:
  - dependencies
  - docker
  commit-message:
    prefix: deps
    include: scope
  ignore:
  # A base-image minor or major jump is a coordinated change (Dockerfile FROM
  # tag, CI, locks), not a dependency bump. Dependabot reads 3.13 to 3.14 as a
  # minor update and would open it. Digest refreshes and patch bumps still flow.
  - dependency-name: python
    update-types:
    - version-update:semver-major
    - version-update:semver-minor
